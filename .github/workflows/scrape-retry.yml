name: 物件データ再収集(すまいーだ・ナカジツ)

# すまいーだ・ナカジツは、サイト側がGitHubの作業場所からのアクセスを
# 日によって「403(お断り)」で返すことがあります(作業場所は実行のたびに変わります)。
# 朝の自動収集で取れなかった日に備えて、夕方にもう一度この2社だけ収集します。
# 朝に取れていた場合は、夕方に取り直しても内容はほぼ変わりません。

on:
  schedule:
    # 毎日 午後7:00(日本時間) = 10:00(世界標準時)
    # ※GitHubの混雑で、実際の開始は設定より遅れることがある
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # GitHubの画面から手動実行するためのボタン

permissions:
  contents: write

jobs:
  scrape-retry:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 必要なライブラリを導入
        run: npm install --no-audit --no-fund

      # 1社が失敗しても、もう1社の収集と保存が止まらないようにしています
      - name: すまいーだの物件を収集
        continue-on-error: true
        run: node scraper/sumaiida.js

      - name: ナカジツの物件を収集
        continue-on-error: true
        run: node scraper/nakajitsu.js

      - name: 最寄り駅を自動設定
        if: always()
        continue-on-error: true
        run: node scraper/stations.js

      - name: 写真を縮小して保存
        if: always()
        continue-on-error: true
        run: node scraper/photos.js

      - name: 変更があればコミットして反映
        if: always()
        run: |
          # 本体の自動収集と同じく、リポジトリの持ち主(依頼主)名義でコミットする
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし(コミットしません)"
          else
            git commit -m "auto: 物件データ再収集(すまいーだ・ナカジツ) $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
            git push
          fi
