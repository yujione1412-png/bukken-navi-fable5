name: 物件データ自動更新

on:
  schedule:
    # 毎日 朝6:00(日本時間) = 前日 21:00(世界標準時)
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # GitHubの画面から手動実行するためのボタン

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 必要なライブラリを導入
        run: npm install --no-audit --no-fund

      - name: マエムラの物件を収集
        run: node scraper/maemura.js

      - name: すまいーだの物件を収集
        run: node scraper/sumaiida.js

      - name: よかタウンの物件を収集
        run: node scraper/yokatown.js

      - name: 最寄り駅を自動設定
        run: node scraper/stations.js

      - name: 写真を縮小して保存
        run: node scraper/photos.js

      - name: 変更があればコミットして反映
        run: |
          git config user.name "bukken-navi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし(コミットしません)"
          else
            git commit -m "auto: 物件データ更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
            git push
          fi
