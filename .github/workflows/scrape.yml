name: 物件データ自動更新

on:
  schedule:
    # 毎日 午前10:00(日本時間) = 01:00(世界標準時)
    # ※GitHubの混雑で、実際の開始は設定より数時間遅れることがある
    - cron: "0 1 * * *"
  workflow_dispatch: {}   # GitHubの画面から手動実行するためのボタン

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 必要なライブラリを導入
        run: npm install --no-audit --no-fund

      # ↓各社の収集には continue-on-error を付けています。
      #   1社が失敗(サイト側の障害・アクセス制限など)しても、残りの会社の収集と
      #   最後の保存が止まらないようにするためです。
      #   失敗した会社は data/status.json に「異常」として記録され、
      #   アプリの「9社の更新状況」に表示されます(前回のデータは安全弁で維持)。
      - name: マエムラの物件を収集
        continue-on-error: true
        run: node scraper/maemura.js

      # すまいーだ・ナカジツは、サイト側がGitHubからのアクセスを断っているため
      # ここでは収集しません。2社分は別途Claudeが毎日収集して反映しています。

      - name: よかタウンの物件を収集
        continue-on-error: true
        run: node scraper/yokatown.js

      - name: 大英産業の物件を収集
        continue-on-error: true
        run: node scraper/daiei.js

      - name: 国分ハウジングの物件を収集
        continue-on-error: true
        run: node scraper/kokubu.js

      - name: タカスギの物件を収集
        continue-on-error: true
        run: node scraper/takasugi.js

      - name: 九建ホームの物件を収集
        continue-on-error: true
        run: node scraper/kyuken.js

      - name: サンタ不動産の物件を収集
        continue-on-error: true
        run: node scraper/santa.js

      - name: 最寄り駅を自動設定
        if: always()
        continue-on-error: true
        run: node scraper/stations.js

      - name: 写真を縮小して保存
        if: always()
        continue-on-error: true
        run: node scraper/photos.js

      - name: 変更があればコミットして反映
        if: always()
        run: |
          # リポジトリの持ち主(依頼主)のGitHubアカウント名義でコミットする。
          # Vercelの無料プランは、非公開リポジトリだと持ち主本人のコミットしか配信しないため
          # (bot名義のままだと、非公開にした後に毎朝のデータがアプリに反映されなくなる)
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし(コミットしません)"
          else
            git commit -m "auto: 物件データ更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
            git push
          fi
