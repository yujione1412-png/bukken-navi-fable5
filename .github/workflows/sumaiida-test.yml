name: すまいーだ接続テスト

on:
  workflow_dispatch: {}   # 手動実行のみ(自動では動きません)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 接続テストを実行
        run: node scraper/sumaiida-test.js
